version: '3.8'

services:
  # Database: PostgreSQL with PostGIS extension
  postgres:
    image: postgis/postgis:15-3.3
    container_name: corvus_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corvus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corvus_password}
      POSTGRES_DB: ${POSTGRES_DB:-corvus_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corvus} -d ${POSTGRES_DB:-corvus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Object Storage: MinIO
  minio:
    image: minio/minio:latest
    container_name: corvus_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Queue & Cache: Redis
  redis:
    image: redis:7-alpine
    container_name: corvus_redis
    restart: always
    ports:
      - "6379:6379"

  # Backend: FastAPI Server
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: corvus_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=postgres
      - MINIO_ENDPOINT=minio:9000
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started

  # Frontend: Next.js App
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: corvus_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
