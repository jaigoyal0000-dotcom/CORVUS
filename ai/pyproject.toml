[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corvus-ai"
version = "0.1.0"
description = "CORVUS AI Engine - SatQuery AI Multi-modal Intelligence"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.41.0",
    "peft>=0.11.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0"
]
