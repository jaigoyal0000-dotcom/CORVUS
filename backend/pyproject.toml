[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corvus-backend"
version = "0.1.0"
description = "CORVUS — THE WATCHING CROW (SatQuery AI Backend)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "minio>=7.2.7",
    "redis>=5.0.4",
    "celery>=5.4.0",
    "python-dotenv>=1.0.1"
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
python_files = "test_*.py"
